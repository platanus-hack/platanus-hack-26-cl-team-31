name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      TURBO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Misma caché de turbo que .github/workflows/test.yml, con su propio prefijo (aquí van builds).
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .turbo/cache
          key: turbo-verify-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            turbo-verify-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            turbo-verify-${{ runner.os }}-
      - run: pnpm turbo run build --summarize --filter=@team-31/web... --filter=@team-31/broker-service... --filter=@team-31/mcp... --filter=@team-31/server...
      - run: pnpm turbo run typecheck --summarize --filter=@team-31/web... --filter=@team-31/broker-service... --filter=@team-31/mcp... --filter=@team-31/server...
      - if: always()
        run: scripts/ci-turbo-prune.sh
      - if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .turbo/cache
          key: turbo-verify-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.run_id }}-${{ github.run_attempt }}

name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter=@team-31/web... --filter=@team-31/broker-service... --filter=@team-31/mcp... --filter=@team-31/server...
      - run: pnpm turbo run typecheck --filter=@team-31/web... --filter=@team-31/broker-service... --filter=@team-31/mcp... --filter=@team-31/server...

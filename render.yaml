# Stack de Sideband en Render (docs/render.md). Costo: 4 servicios starter ($7 c/u),
# Postgres basic-256mb ($6) y el cron de autodeploy (~$1) ≈ $35/mes.
#
# Los servicios usan el repo público de la org: Render no recibe su webhook, así que
# autoDeploy queda apagado y `sideband-autodeploy` despliega cuando cambia `main`.
# Los secretos (sync: false) se cargan en Render al aprobar el Blueprint, nunca aquí.

envVarGroups:
  - name: sideband-shared
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: COREPACK_ENABLE_DOWNLOAD_PROMPT
        value: "0"
      - key: TURBO_TELEMETRY_DISABLED
        value: "1"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: TELEMETRY_SINK
        value: postgres

databases:
  - name: sideband-db
    databaseName: app
    plan: basic-256mb
    region: oregon
    postgresMajorVersion: "17"
    # Solo la red privada de Render.
    ipAllowList: []

services:
  # Web (Next, OAuth) + MCP en loopback. Con RENDER=true, next.config reenvía /mcp,
  # /healthz y la metadata OAuth al MCP en MCP_PORT: el MCP vive en el mismo origen.
  - type: web
    name: sideband-web
    runtime: node
    plan: starter
    region: oregon
    repo: https://github.com/platanus-hack/platanus-hack-26-cl-team-31
    branch: main
    autoDeployTrigger: "off"
    buildCommand: corepack pnpm install --frozen-lockfile --prod=false && corepack pnpm exec turbo run build --filter=@team-31/web... --filter=@team-31/mcp...
    preDeployCommand: cd apps/web && node scripts/migrate-auth.mjs
    startCommand: >-
      bash -c 'node apps/mcp/dist/index.js &
      (cd apps/web && exec node node_modules/next/dist/bin/next start --hostname 0.0.0.0 --port "$PORT") &
      wait -n; exit 1'
    healthCheckPath: /healthz
    envVars:
      - fromGroup: sideband-shared
      - key: MCP_PORT
        value: "4100"
      - key: MCP_DEV_AUTH
        value: "0"
      - key: DATABASE_URL
        fromDatabase:
          name: sideband-db
          property: connectionString
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: BETTER_AUTH_URL
        value: https://sideband-web.onrender.com
      - key: MCP_RESOURCE_URL
        value: https://sideband-web.onrender.com/mcp
      - key: AUTH_ISSUER
        value: https://sideband-web.onrender.com/api/auth
      - key: AUTH_JWKS_URL
        value: https://sideband-web.onrender.com/api/auth/jwks
      - key: BROKER_URL
        value: http://sideband-broker:10000
      - key: WEB_SERVICE_PRIVATE_KEY
        sync: false
      - key: MCP_SERVICE_PRIVATE_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: KAPSO_API_KEY
        sync: false
      - key: KAPSO_PHONE_NUMBER_ID
        sync: false
      - key: KAPSO_WHATSAPP_NUMBER
        sync: false
      - key: KAPSO_WEBHOOK_SECRET
        sync: false

  # Broker: servicio privado, solo alcanzable desde la red interna de Render.
  - type: pserv
    name: sideband-broker
    runtime: node
    plan: starter
    region: oregon
    repo: https://github.com/platanus-hack/platanus-hack-26-cl-team-31
    branch: main
    autoDeployTrigger: "off"
    buildCommand: corepack pnpm install --frozen-lockfile --prod=false && corepack pnpm exec turbo run build --filter=@team-31/broker-service...
    preDeployCommand: node apps/broker/scripts/migrate.mjs
    startCommand: cd apps/broker && bash scripts/run.sh node dist/index.js
    envVars:
      - fromGroup: sideband-shared
      - key: BROKER_HOST
        value: 0.0.0.0
      - key: BROKER_PORT
        value: "10000"
      - key: DATABASE_URL
        fromDatabase:
          name: sideband-db
          property: connectionString
      - key: BROKER_SIGNING_KEY
        sync: false
      - key: NONCE_KEY
        sync: false
      - key: WAKE_SECRETS_KEY
        sync: false
      - key: SERVICE_JWT_PUBLIC_KEYS
        sync: false
      - key: REQUEST_TTL_SECONDS
        value: "900"
      - key: WAKE_RETRY_DELAYS_MS
        value: 10000,30000
      - key: WAKE_ALLOW_INSECURE
        value: "0"

  # Panel y MCP de administración (docs/admin.md). Un solo proceso sirve SPA, API y /mcp.
  - type: web
    name: sideband-admin
    runtime: node
    plan: starter
    region: oregon
    repo: https://github.com/platanus-hack/platanus-hack-26-cl-team-31
    branch: main
    autoDeployTrigger: "off"
    buildCommand: corepack pnpm install --frozen-lockfile --prod=false && corepack pnpm exec turbo run build --filter=@team-31/admin... --filter=@team-31/ops...
    preDeployCommand: cd apps/admin && node_modules/.bin/tsx server/auth/migrate.ts && cd ../../packages/ops && node dist/cli.js
    startCommand: cd apps/admin && node dist/server/server/index.js
    healthCheckPath: /healthz
    envVars:
      - fromGroup: sideband-shared
      - key: ADMIN_HOST
        value: 0.0.0.0
      - key: ADMIN_PORT
        value: "10000"
      - key: ADMIN_SERVE_SPA
        value: "1"
      - key: ADMIN_TRUST_PROXY
        value: "1"
      - key: ADMIN_URL
        value: https://sideband-admin.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: sideband-db
          property: connectionString
      - key: ADMIN_AUTH_SECRET
        generateValue: true
      - key: ADMIN_SERVICE_PRIVATE_KEY
        sync: false
      - key: ADMIN_OPERATORS
        sync: false
      - key: ADMIN_VIEWERS
        sync: false
      - key: ADMIN_GOOGLE_CLIENT_ID
        sync: false
      - key: ADMIN_GOOGLE_CLIENT_SECRET
        sync: false
      - key: BROKER_URL
        value: http://sideband-broker:10000
      - key: TELEMETRY_RETENTION_DAYS
        value: "14"

  # API de coordinación (apps/server).
  - type: web
    name: sideband-coordination
    runtime: node
    plan: starter
    region: oregon
    repo: https://github.com/platanus-hack/platanus-hack-26-cl-team-31
    branch: main
    autoDeployTrigger: "off"
    buildCommand: corepack pnpm install --frozen-lockfile --prod=false && corepack pnpm exec turbo run build --filter=@team-31/server...
    preDeployCommand: node apps/server/scripts/schema.mjs
    startCommand: node apps/server/dist/index.js
    envVars:
      - fromGroup: sideband-shared
      - key: COORDINATION_HOST
        value: 0.0.0.0
      - key: COORDINATION_PORT
        value: "10000"
      - key: DATABASE_URL
        fromDatabase:
          name: sideband-db
          property: connectionString

  # Despliega los servicios de arriba cuando cambia `main` (infra/render/autodeploy.mjs).
  # Lee el script de esta rama hasta que el PR llegue a main.
  - type: cron
    name: sideband-autodeploy
    runtime: node
    plan: starter
    region: oregon
    repo: https://github.com/platanus-hack/platanus-hack-26-cl-team-31
    branch: chore/render-deploy
    schedule: "*/5 * * * *"
    buildCommand: "true"
    startCommand: node infra/render/autodeploy.mjs
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: AUTODEPLOY_REPO
        value: https://github.com/platanus-hack/platanus-hack-26-cl-team-31
      - key: AUTODEPLOY_BRANCH
        value: main
      - key: AUTODEPLOY_SERVICES
        value: sideband-broker,sideband-web,sideband-admin,sideband-coordination
      - key: RENDER_API_KEY
        sync: false

# Infra local. Cada worktree levanta su propio stack aislado:
# COMPOSE_PROJECT_NAME y los puertos vienen del .env generado por `pnpm env:init`.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
    ports:
      - "${POSTGRES_PORT:-54320}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:

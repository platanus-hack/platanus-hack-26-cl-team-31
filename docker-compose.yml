# Infra local. Cada worktree levanta su propio stack aislado:
# COMPOSE_PROJECT_NAME y los puertos vienen del .env generado por `pnpm env:init`.
# Demo, tests y carga efímeros en Docker: `pnpm docker:demo [N]` / `pnpm docker:test` / `pnpm scale:run <escenario>`.
x-app: &app
  build: .
  image: team31/app:local
  environment: &app-env
    DATABASE_URL: postgresql://postgres:postgres@postgres:5432/app
    TEST_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/app_test
    COORDINATION_PORT: "4310"
    COORDINATION_API_URL: http://coordination:4310

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-54320}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 2s
      timeout: 3s
      retries: 20

  broker:
    profiles: ["sideband"]
    image: node:24-alpine
    working_dir: /workspace
    command: ["node", "apps/broker/dist/index.js"]
    volumes:
      - .:/workspace:ro
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: postgresql://sideband_broker:${BROKER_DATABASE_PASSWORD:-}@postgres:5432/app
      BROKER_PORT: ${BROKER_PORT:-}
      BROKER_HOST: 0.0.0.0
      BROKER_SIGNING_KEY: ${BROKER_SIGNING_KEY:-}
      NONCE_KEY: ${NONCE_KEY:-}
      WAKE_SECRETS_KEY: ${WAKE_SECRETS_KEY:-}
      SERVICE_JWT_PUBLIC_KEYS: ${SERVICE_JWT_PUBLIC_KEYS:-}
      REQUEST_TTL_SECONDS: ${REQUEST_TTL_SECONDS:-900}
      WAKE_RETRY_DELAYS_MS: ${WAKE_RETRY_DELAYS_MS:-10000,30000}
      WAKE_ALLOW_INSECURE: ${WAKE_ALLOW_INSECURE:-0}
      # Telemetría (ops.events). Sin TELEMETRY_DATABASE_URL usa DATABASE_URL: sideband_broker tiene INSERT en ops.events.
      TELEMETRY_SINK: ${TELEMETRY_SINK:-}
      TELEMETRY_DATABASE_URL: ${TELEMETRY_DATABASE_URL:-}
    ports:
      - "127.0.0.1:${BROKER_PORT:-}:${BROKER_PORT:-}"
    depends_on:
      postgres:
        condition: service_healthy

  # API de coordinación. En el host requiere esquema + seed previos (pnpm agents:up los hace).
  coordination:
    <<: *app
    profiles: ["agents", "demo", "scale"]
    command: ["node", "apps/server/dist/index.js"]
    environment:
      <<: *app-env
      COORDINATION_HOST: 0.0.0.0
      TELEMETRY_SINK: ${TELEMETRY_SINK:-}
      TELEMETRY_DATABASE_URL: ${TELEMETRY_DATABASE_URL:-}
    ports:
      - "127.0.0.1:${COORDINATION_PORT:-4310}:4310"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4310/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 20
    depends_on:
      postgres:
        condition: service_healthy

  # Demo MCP end-to-end. Usar vía `pnpm docker:demo` (stack aislado: siembra sus propias identidades).
  demo:
    <<: *app
    profiles: ["demo"]
    entrypoint: ["sh", "infra/docker/demo.sh"]
    command: ["3"]
    depends_on:
      coordination:
        condition: service_healthy

  # Carga + invariantes (apps/scale). Usar vía `pnpm scale:run <escenario>`: siembra con --reset,
  # así que sólo debe correr en el stack aislado. Resultados JSON en ./.scale-results (gitignored).
  scale:
    <<: *app
    profiles: ["scale"]
    entrypoint: ["node", "apps/scale/src/run.mjs", "--reset"]
    command: ["smoke"]
    user: "${SCALE_UID:-0}:${SCALE_GID:-0}"
    environment:
      <<: *app-env
      SCALE_RESULTS_DIR: /app/.scale-results
      SCALE_RUN_ID: ${SCALE_RUN_ID:-}
    volumes:
      - ./.scale-results:/app/.scale-results
    depends_on:
      coordination:
        condition: service_healthy

  # Tests del stack de coordinación (server + scale) contra la base app_test. El resto del
  # monorepo se prueba con `pnpm test` en el host; esta imagen sólo trae lo que sirve.
  test:
    <<: *app
    profiles: ["test"]
    command: ["pnpm", "turbo", "run", "test", "--continue", "--filter=@team-31/server", "--filter=@team-31/scale"]
    depends_on:
      postgres:
        condition: service_healthy

  ollama:
    profiles: ["demo-model"]
    image: ollama/ollama:0.40.17
    ports:
      - "127.0.0.1:${DEMO_MODEL_PORT:-}:11434"
    volumes:
      - models:/root/.ollama

  mcp:
    profiles: ["sideband"]
    image: node:24-alpine
    working_dir: /workspace
    command: ["node", "apps/mcp/dist/index.js"]
    volumes:
      - .:/workspace:ro
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      MCP_HOST: 0.0.0.0
      MCP_PORT: ${MCP_PORT}
      MCP_RESOURCE_URL: ${MCP_RESOURCE_URL}
      AUTH_ISSUER: ${AUTH_ISSUER}
      AUTH_JWKS_URL: ${AUTH_JWKS_URL}
      BROKER_URL: ${BROKER_URL:-}
      MCP_SERVICE_PRIVATE_KEY: ${MCP_SERVICE_PRIVATE_KEY:-}
      MCP_DEV_AUTH: ${MCP_DEV_AUTH:-0}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      MESSAGE_FLOW_MODEL: ${MESSAGE_FLOW_MODEL:-}
      MESSAGE_FLOW_DATABASE_URL: ${MESSAGE_FLOW_DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/app}
      TELEMETRY_SINK: ${TELEMETRY_SINK:-}
      TELEMETRY_DATABASE_URL: ${TELEMETRY_DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/app}
    ports:
      - "127.0.0.1:${MCP_PORT}:${MCP_PORT}"
    depends_on:
      postgres:
        condition: service_healthy

  # Admin de Sideband (SPA + API + MCP admin en un solo puerto). Compila antes con
  # `pnpm build --filter @team-31/admin...`. Ver apps/admin/README.md.
  admin:
    profiles: ["sideband"]
    image: node:24-alpine
    working_dir: /workspace/apps/admin
    command: ["node", "dist/server/server/index.js"]
    volumes:
      - .:/workspace:ro
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      ADMIN_HOST: 0.0.0.0
      ADMIN_PORT: ${ADMIN_PORT}
      ADMIN_SERVE_SPA: "1"
      ADMIN_URL: ${ADMIN_URL}
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/app
      ADMIN_AUTH_SECRET: ${ADMIN_AUTH_SECRET:-}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      ADMIN_GOOGLE_CLIENT_ID: ${ADMIN_GOOGLE_CLIENT_ID:-}
      ADMIN_GOOGLE_CLIENT_SECRET: ${ADMIN_GOOGLE_CLIENT_SECRET:-}
      ADMIN_OPERATORS: ${ADMIN_OPERATORS:-}
      ADMIN_VIEWERS: ${ADMIN_VIEWERS:-}
      ADMIN_DEV_AUTH: ${ADMIN_DEV_AUTH:-0}
      ADMIN_FRESH_SECONDS: ${ADMIN_FRESH_SECONDS:-600}
      ADMIN_SERVICE_PRIVATE_KEY: ${ADMIN_SERVICE_PRIVATE_KEY:-}
      BROKER_URL: http://broker:${BROKER_PORT:-}
      TELEMETRY_SINK: ${TELEMETRY_SINK:-postgres}
      TELEMETRY_RETENTION_DAYS: ${TELEMETRY_RETENTION_DAYS:-14}
    ports:
      - "127.0.0.1:${ADMIN_PORT}:${ADMIN_PORT}"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  models:
